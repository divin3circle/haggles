# Render Blueprint for Haggles (SPEC.md section 14.3)
# Validated against https://render.com/schema/render.yaml.json

databases:
  - name: haggles-db
    plan: free
    postgresMajorVersion: "16"

envVarGroups:
  - name: haggles-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: HAGGLES_ENV
        value: test
      - key: PAYPAL_MODE
        value: sandbox
      - key: PLATFORM_FEE_BPS
        value: "500"
      - key: LOG_LEVEL
        value: info
      - key: MASTER_KEY
        sync: false
      - key: KEY_PEPPER
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_OIDC_REDIRECT_URI
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_PORTAL_URL
        sync: false

services:
  - type: web
    name: haggles-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: haggles-shared
      - key: DATABASE_URL
        fromDatabase:
          name: haggles-db
          property: connectionString

  - type: web
    name: haggles-portal
    runtime: docker
    dockerfilePath: ./apps/portal/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: haggles-shared
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: haggles-api
          property: hostport
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_DOCS_URL
        sync: false

  - type: web
    name: haggles-docs
    runtime: static
    buildCommand: bun install && bun run --filter @haggles/core build && cd apps/docs && bun run build
    staticPublishPath: apps/docs/dist
    autoDeployTrigger: checksPass
